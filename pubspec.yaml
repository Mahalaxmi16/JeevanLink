name: jeevanlink
description: "A new Flutter project."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.2.3 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_web_plugins:
    sdk: flutter
  
  # Backend & Core
  supabase_flutter: 2.10.0
  shared_preferences: ^2.2.2
  firebase_core: ^3.4.1
  firebase_auth: ^5.2.1
  sendotp_flutter_sdk: ^0.0.2
  geolocator: ^11.0.0
  provider: ^6.1.2 # For simple state management
  intl: ^0.19.0 # For formatting dates, times, etc.
  flutter_launcher_icons: ^0.13.1

  # UI & UX
  google_maps_flutter: ^2.6.1 # For displaying maps
  google_fonts: ^6.2.1 # For beautiful, custom fonts
  flutter_spinkit: ^5.2.1 # For nice loading animations
  lottie: ^3.1.2 # For more complex, high-quality animations
  google_maps_flutter_android: ^2.5.0
  google_maps_flutter_ios: ^2.3.0
  location: ^5.0.0  # For location permissions
  http: ^1.1.0  # For Google Directions API calls
  bcrypt: ^1.1.3  # For password hashing
  
  # Optional: For better location permissions handling
  permission_handler: ^11.0.1
  flutter_local_notifications: ^18.0.1 # For local notifications
  # Utilities
  url_launcher: ^6.2.6 # For opening links, maps, etc.
  # Add this to pubspec.yaml dependencies
  uuid: ^4.0.0
  crypt: ^4.3.1
  flutter_dotenv: ^5.1.0


dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^2.0.0

flutter:
  uses-material-design: true
  assets:
    - .env
    - assets/app_icon.png 
flutter_icons:
  android: true
  ios: true
  image_path: "assets/app_icon.png"
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: "assets/app_icon.png"

